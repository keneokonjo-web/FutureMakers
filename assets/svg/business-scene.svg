      <rect x="226" y="186" width="16" height="16" rx="2"/><path d="M230 194l4 4 7-10" stroke="#FF6A1F" stroke-width="4"/><path d="M252 194h44" opacity=".5"/>
      <rect x="226" y="222" width="16" height="16" rx="2"/><path d="M252 230h52" opacity=".5"/>
      <path d="M30 346H196M30 366H140" opacity=".3" stroke-width="4"/>
    </g>
  </g>

  <!-- lightbulb -->
  <g transform="translate(6 -4) scale(1.35)">
    <path d="M6 12 12 17M58 12 52 17M2 33 9 34M62 33 55 34" fill="none" stroke="#FF6A1F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M32 8C14 8 6 22 8 35 10 46 18 50 20 60H44C46 50 54 46 56 35 58 22 50 8 32 8Z" fill="#FFFBF2" stroke="#15131F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M24 44 28 33 32 41 36 33 40 44" fill="none" stroke="#15131F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="60" width="24" height="8" rx="2" fill="#FFD83D" stroke="#15131F" stroke-width="3.5"/>
    <rect x="24" y="68" width="16" height="8" rx="3" fill="#2B3FE0" stroke="#15131F" stroke-width="3.5"/>
  </g>

  <!-- sticky note -->
  <g transform="translate(388 22) rotate(7)">
