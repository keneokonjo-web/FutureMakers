    <path d="M170 186 175 198 188 199 178 207 181 220 170 213 159 220 162 207 152 199 165 198Z" fill="#FFD83D" stroke="#15131F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M132 100C148 86 206 88 210 118 212 142 160 148 140 134 126 124 128 106 158 96" fill="none" stroke="#FF6A1F" stroke-width="3.5" stroke-linecap="round"/>
    <!-- dimension line -->
    <path d="M116 112V310M108 112h16M108 310h16" fill="none" stroke="#15131F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M92 206q7-7 14 0t14 0" fill="none" stroke="#15131F" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
    <!-- checklist -->
    <g fill="none" stroke="#15131F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
