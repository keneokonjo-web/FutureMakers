  <!-- dotted paths -->
  <g fill="none" stroke="#FF6A1F" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12">
    <path d="M270 360C320 392 262 392 296 412"/>
    <path d="M372 470C392 462 398 440 410 424"/>
