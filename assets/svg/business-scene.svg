<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="t"><title id="t">A collage of making a business: a product sketch, a lightbulb, a packaging box, a price tag, a business card, a small bar chart and a tiny shop</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#15131F" opacity=".22"/></pattern>
  </defs>

  <!-- sketchbook page -->
