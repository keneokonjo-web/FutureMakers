    <rect x="10" y="10" width="340" height="392" rx="6" fill="#15131F"/>
    <rect width="340" height="392" rx="6" fill="#FFFBF2" stroke="#15131F" stroke-width="4"/>
    <rect width="340" height="392" rx="6" fill="url(#dots)"/>
    <rect x="118" y="-14" width="104" height="30" fill="#FF8A7A" stroke="#15131F" stroke-width="3" transform="rotate(3 170 0)"/>
    <path d="M30 52H156" stroke="#15131F" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 74H112" stroke="#15131F" stroke-width="4" stroke-linecap="round" opacity=".3"/>
    <!-- bottle -->
    <rect x="150" y="110" width="40" height="26" rx="5" fill="#FF6A1F" stroke="#15131F" stroke-width="3.5"/>
