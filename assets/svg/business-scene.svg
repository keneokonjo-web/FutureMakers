    <rect width="120" height="120" fill="#FF8A7A" stroke="#15131F" stroke-width="4"/>
    <path d="M18 40H94M18 62H78M18 84H102" stroke="#15131F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M92 100 96 108 105 109 98 115 100 123 92 118 84 123 86 115 79 109 88 108Z" fill="#FFD83D" stroke="#15131F" stroke-width="2.5" stroke-linejoin="round"/>
