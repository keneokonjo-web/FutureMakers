  <!-- sparkles -->
  <path d="M596 44C597 56 602 61 614 62 602 63 597 68 596 80 595 68 590 63 578 62 590 61 595 56 596 44Z" fill="#2B3FE0"/>
  <path d="M40 290C41 298 44 301 52 302 44 303 41 306 40 314 39 306 36 303 28 302 36 301 39 298 40 290Z" fill="#15131F"/>
</svg>
