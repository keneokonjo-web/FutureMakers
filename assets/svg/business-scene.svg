    <rect width="150" height="90" fill="#FFFBF2" stroke="#15131F" stroke-width="4"/>
    <path d="M16 72V44a15 15 0 0 1 30 0V72Z" fill="#2B3FE0" stroke="#15131F" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="26" cy="50" r="4.5" fill="#fff" stroke="#15131F" stroke-width="2"/><circle cx="38" cy="49" r="4" fill="#fff" stroke="#15131F" stroke-width="2"/>
    <circle cx="27" cy="51" r="2" fill="#15131F"/><circle cx="39" cy="50" r="1.8" fill="#15131F"/>
    <path d="M62 34H134M62 52H116M62 68H98" stroke="#15131F" stroke-width="4" stroke-linecap="round" opacity=".75" fill="none"/>
