      <path d="M45 22h15v16a7.5 7.5 0 0 1-15 0Z" fill="#FF6A1F"/><path d="M60 22h15v16a7.5 7.5 0 0 1-15 0Z" fill="#FFFBF2"/>
      <path d="M75 22h15v16a7.5 7.5 0 0 1-15 0Z" fill="#FF6A1F"/><path d="M90 22h15v16a7.5 7.5 0 0 1-15 0Z" fill="#FFFBF2"/>
