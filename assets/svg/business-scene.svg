    <rect x="24" y="62" width="24" height="42" fill="#2B3FE0" stroke="#15131F" stroke-width="4"/><circle cx="43" cy="84" r="2.5" fill="#FFD83D"/>
    <rect x="58" y="58" width="38" height="28" fill="#FFD83D" stroke="#15131F" stroke-width="4"/>
    <path d="M64 80 70 70 76 78 80 72 90 80" fill="none" stroke="#15131F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 104h108" stroke="#15131F" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M580 300 590 322 612 325 596 340 600 362 580 352 560 362 564 340 548 325 570 322Z" transform="translate(0 -20) scale(.8) translate(150 70)" fill="#FFD83D" stroke="#15131F" stroke-width="4" stroke-linejoin="round"/>

  <!-- packaging box -->
  <g transform="translate(222 410)" stroke="#15131F" stroke-width="4" stroke-linejoin="round">
    <path d="M0 34 74 4 148 34 74 66Z" fill="#FF6A1F"/>
    <path d="M0 34 74 66V138L0 106Z" fill="#2B3FE0"/>
    <path d="M74 66 148 34V106L74 138Z" fill="#4A5DF5"/>
    <path d="M37 19 111 50" stroke="#FFD83D" stroke-width="9" fill="none" stroke-linecap="butt"/>
    <path d="M37 88 41 98 52 99 44 106 46 116 37 110 28 116 30 106 22 99 33 98Z" transform="translate(0 -4)" fill="#FFD83D" stroke-width="3"/>
  </g>

  <!-- bar chart card -->
  <g transform="translate(18 436) rotate(-3)">
    <rect x="8" y="8" width="176" height="112" fill="#15131F"/>
    <rect width="176" height="112" fill="#FFFBF2" stroke="#15131F" stroke-width="4"/>
    <g stroke="#15131F" stroke-width="3.5" stroke-linejoin="round">
      <rect x="22" y="68" width="26" height="30" fill="#FFD83D"/><rect x="62" y="50" width="26" height="48" fill="#FF6A1F"/><rect x="102" y="30" width="26" height="68" fill="#2B3FE0"/>
    </g>
    <path d="M14 100H162" stroke="#15131F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M26 44C60 40 100 22 146 12M132 8l16 3-9 15" fill="none" stroke="#FF6A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- coins -->
  <g stroke="#15131F" stroke-width="3.5">
    <circle cx="206" cy="540" r="24" fill="#FFD83D"/><circle cx="206" cy="540" r="15" fill="none" stroke-width="2.5" stroke-dasharray="3 4"/>
    <circle cx="166" cy="552" r="20" fill="#FFD83D"/><circle cx="166" cy="552" r="12" fill="none" stroke-width="2.5" stroke-dasharray="3 4"/>
