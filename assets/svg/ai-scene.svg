    <circle cx="50" cy="21" r="7.5" fill="#FFFFFF" stroke="#15131F" stroke-width="3"/>
    <circle cx="74" cy="21" r="7.5" fill="#7EE0C3" stroke="#15131F" stroke-width="3"/>
    <path d="M30 84H258M30 108H336M30 132H206" fill="none" stroke="#15131F" stroke-width="7" stroke-linecap="round" opacity=".85"/>
    <path d="M30 108H336" fill="none" stroke="#FFFBF2" stroke-width="0"/>
