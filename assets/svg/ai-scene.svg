    <circle cx="32" cy="5" r="4.5" fill="#FF6A1F" stroke="#15131F" stroke-width="3"/>
    <rect x="8" y="12" width="48" height="40" rx="12" fill="#7EE0C3" stroke="#15131F" stroke-width="4"/>
    <circle cx="23" cy="30" r="6" fill="#FFFFFF" stroke="#15131F" stroke-width="3"/><circle cx="41" cy="30" r="6" fill="#FFFFFF" stroke="#15131F" stroke-width="3"/>
