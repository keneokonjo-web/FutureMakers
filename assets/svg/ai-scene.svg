      <path d="M124 100V88M158 94V80M192 100V88" fill="none" stroke="#2B3FE0" stroke-width="3"/>
      <ellipse cx="136" cy="212" rx="14" ry="8" fill="#FF6A1F"/>
      <ellipse cx="182" cy="212" rx="14" ry="8" fill="#FF6A1F"/>
      <circle cx="139" cy="148" r="12" fill="#FFFFFF"/><circle cx="177" cy="148" r="12" fill="#FFFFFF"/>
      <circle cx="142" cy="150" r="5.5" fill="#15131F" stroke="none"/><circle cx="180" cy="150" r="5.5" fill="#15131F" stroke="none"/>
      <path d="M152 164h12l-6 8Z" fill="#2B3FE0" stroke-width="3"/>
      <path d="M148 178q10 9 20 0" fill="none"/>
      <circle cx="122" cy="176" r="6" fill="#FFD83D" stroke-width="3"/><circle cx="196" cy="172" r="5" fill="#FFD83D" stroke-width="3"/>
    </g>
    <path d="M250 76C251 86 255 90 264 91 255 92 251 96 250 106 249 96 245 92 236 91 245 90 249 86 250 76Z" fill="#2B3FE0"/>
    <path d="M52 76C53 84 56 87 64 88 56 89 53 92 52 100 51 92 48 89 40 88 48 87 51 84 52 76Z" fill="#FF6A1F"/>
