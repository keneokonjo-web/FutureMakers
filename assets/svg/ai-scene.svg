    <path d="M22 22H74M22 36H56" stroke="#15131F" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".7"/>
  </g>

  <!-- curl arrow from prompt to result -->
  <g fill="none" stroke="#FFFBF2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 338C214 402 262 430 304 408"/>
    <path d="M286 394 306 407 292 424"/>
