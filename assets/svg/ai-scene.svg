    <path d="M316 198H340M330 187 341 198 330 209" fill="none" stroke="#FFFBF2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(334 206) scale(1.15)" d="M6 4V38L15 30 21 44 28 41 22 28H34Z" fill="#FFFFFF" stroke="#15131F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- result window -->
  <g transform="translate(326 298) scale(.9) rotate(4 150 140)">
