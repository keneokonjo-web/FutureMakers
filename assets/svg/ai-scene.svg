    <g stroke="#15131F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M212 176C246 164 252 200 226 202" fill="none"/>
      <path d="M118 124 108 84 142 108Z" fill="#FF8A7A"/>
      <path d="M198 124 208 84 174 108Z" fill="#FF8A7A"/>
