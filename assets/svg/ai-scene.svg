  <!-- abstract shapes + stars -->
  <path d="M560 54 604 110 520 110Z" fill="#FFD83D" stroke="#15131F" stroke-width="4" stroke-linejoin="round" transform="rotate(12 560 84)"/>
  <circle cx="580" cy="176" r="22" fill="none" stroke="#7EE0C3" stroke-width="9"/>
  <path d="M470 38q14-22 28 0t28 0" fill="none" stroke="#FF8A7A" stroke-width="7" stroke-linecap="round"/>
  <path d="M446 36C448 54 456 62 474 64 456 66 448 74 446 92 444 74 436 66 418 64 436 62 444 54 446 36Z" fill="#FFFBF2" transform="translate(-20 -10) scale(.8)"/>
  <path d="M34 36C35 46 40 51 50 52 40 53 35 58 34 68 33 58 28 53 18 52 28 51 33 46 34 36Z" fill="#FFD83D"/>
  <path d="M606 470C607 482 612 487 624 488 612 489 607 494 606 506 605 494 600 489 588 488 600 487 605 482 606 470Z" fill="#FFFBF2"/>
  <path d="M590 340 600 360 622 363 606 378 610 400 590 389 570 400 574 378 558 363 580 360Z" fill="#FF8A7A" stroke="#15131F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M232 528q10-12 20 0t20 0t20 0" fill="none" stroke="#FFD83D" stroke-width="6" stroke-linecap="round"/>
</svg>
